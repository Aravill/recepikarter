<svg xmlns="http://www.w3.org/2000/svg" width="76.8mm" height="155.5mm" viewBox="0 0 76.8 155.5">
  <title>Recepikarter — pocket card example (back), Svíčková na smetaně</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600;700&amp;display=swap');
      /* font-size is unitless: the viewBox is already in mm, so 1 user unit = 1mm */
      .section   { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 600; font-size: 2px; letter-spacing: .06px; fill: #b8502a; }
      .step-num  { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 700; font-size: 2.1px; fill: #a1423a; text-anchor: middle; dominant-baseline: central; }
      .step-txt  { font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; font-weight: 400; font-size: 2.75px; fill: #221f1c; }
      .foot      { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 500; font-size: 1.85px; fill: #6b6255; letter-spacing: .03px; }
    </style>
  </defs>

  <!-- full-bleed card background -->
  <rect x="0" y="0" width="76.8" height="155.5" rx="3.2" fill="#efe9de"/>

  <!-- difficulty stripe (Těžká / Hard) -->
  <path d="M0,3.2 A3.2,3.2 0 0 1 3.2,0 L73.6,0 A3.2,3.2 0 0 1 76.8,3.2 L76.8,4.5 L0,4.5 Z" fill="#a1423a"/>

  <!-- trim line: cut here after laminating -->
  <rect x="2.5" y="2.5" width="71.8" height="150.5" rx="2" fill="none" stroke="#221f1c" stroke-opacity=".28" stroke-width=".35" stroke-dasharray="1.4 1.2"/>

  <text x="8" y="13.5" class="section">POSTUP</text>

  <!-- steps: circled number + 1-2 line instruction -->
  <g>
    <circle cx="9.3" cy="23.1" r="2.6" fill="#f1dcd9"/>
    <text x="9.3" y="23.1" class="step-num">1</text>
    <text x="16" y="24" class="step-txt">Maso naspikujte slaninou, osolte.</text>
  </g>

  <g>
    <circle cx="9.3" cy="36.1" r="2.6" fill="#f1dcd9"/>
    <text x="9.3" y="36.1" class="step-num">2</text>
    <text x="16" y="37" class="step-txt">Zeleninu a koření orestujte</text>
    <text x="16" y="40.6" class="step-txt">dozlatova.</text>
  </g>

  <g>
    <circle cx="9.3" cy="49.1" r="2.6" fill="#f1dcd9"/>
    <text x="9.3" y="49.1" class="step-num">3</text>
    <text x="16" y="50" class="step-txt">Přidejte maso, podlijte vodou a</text>
    <text x="16" y="53.6" class="step-txt">duste doměkka.</text>
  </g>

  <g>
    <circle cx="9.3" cy="62.1" r="2.6" fill="#f1dcd9"/>
    <text x="9.3" y="62.1" class="step-num">4</text>
    <text x="16" y="63" class="step-txt">Maso vyjměte, základ rozmixujte</text>
    <text x="16" y="66.6" class="step-txt">se smetanou.</text>
  </g>

  <g>
    <circle cx="9.3" cy="75.1" r="2.6" fill="#f1dcd9"/>
    <text x="9.3" y="75.1" class="step-num">5</text>
    <text x="16" y="76" class="step-txt">Propasírujte, dochuťte octem a</text>
    <text x="16" y="79.6" class="step-txt">cukrem.</text>
  </g>

  <g>
    <circle cx="9.3" cy="88.1" r="2.6" fill="#f1dcd9"/>
    <text x="9.3" y="88.1" class="step-num">6</text>
    <text x="16" y="89" class="step-txt">Maso zalijte omáčkou, podávejte</text>
    <text x="16" y="92.6" class="step-txt">s knedlíkem.</text>
  </g>

  <line x1="8" y1="140" x2="68.8" y2="140" stroke="#d8cfbe" stroke-width=".3"/>
  <text x="8" y="146" class="foot">Svíčková na smetaně</text>
  <text x="68.8" y="146" class="foot" text-anchor="end">2 / 2</text>
</svg>
