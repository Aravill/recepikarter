<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recepikarter — Přihlášení</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1815;
    --text: #efe9de;
    --text-dim: #a89f8f;
    --surface: #efe9de;
    --surface-ink: #221f1c;
    --surface-ink-dim: #6b6255;
    --rule: #d8cfbe;
    --accent: #b8502a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-body {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .wordmark {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 26px;
    color: var(--text);
    text-align: center;
  }
  .wordmark small {
    display: block;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 7px;
  }
  .login-panel {
    width: 100%;
    background: var(--surface);
    border-radius: 14px;
    padding: 26px 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--surface-ink-dim);
  }
  .field input {
    font: 400 15px 'IBM Plex Sans', sans-serif;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--rule);
    background: #fff;
    color: var(--surface-ink);
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    background: var(--accent);
    color: #fdf9f2;
    cursor: pointer;
  }
  .login-hint {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 0;
  }
</style>
</head>
<body>
  <div class="login-body">
    <div class="wordmark">Recepikarter<small>Kartotéka receptů</small></div>
    <form class="login-panel">
      <div class="field">
        <label for="u">Uživatelské jméno</label>
        <input id="u" type="text" name="username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="p">Heslo</label>
        <input id="p" type="password" name="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary">Přihlásit se</button>
    </form>
    <p class="login-hint">Přístup jen pro domácnost — bez registrace.</p>
  </div>
</body>
</html>
